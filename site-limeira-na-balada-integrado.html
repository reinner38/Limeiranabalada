<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Limeira na Balada | Limeira do Oeste - MG</title>
<style>
:root{--bg:#080a0f;--card:#131923;--line:#293141;--yellow:#ffd400;--text:#f5f7fb;--muted:#aeb6c5}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
.container{width:min(1180px,92%);margin:auto}header{background:#0b0e14;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.nav{height:74px;display:flex;align-items:center;justify-content:space-between;gap:20px}.logo{font-weight:900;font-size:25px;text-transform:uppercase;font-style:italic}.logo span{color:var(--yellow)}
nav{display:flex;gap:18px}nav a{color:white;text-decoration:none;font-weight:bold}
.hero{padding:90px 0;background:radial-gradient(circle at 70% 30%,#4c1d95,transparent 30%),linear-gradient(120deg,#080a0f,#18100a)}
.badge{background:var(--yellow);color:#111;padding:8px 12px;border-radius:999px;font-weight:bold;display:inline-block}h1{font-size:clamp(45px,8vw,90px);margin:20px 0 10px;text-transform:uppercase;font-style:italic}h1 strong{color:var(--yellow)}
p{color:var(--muted);line-height:1.5}.btn{display:inline-block;background:var(--yellow);color:#111;padding:14px 20px;border-radius:10px;text-decoration:none;font-weight:900;margin-top:15px}
section{padding:55px 0}.title{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}.cover{height:160px;background:linear-gradient(135deg,#7c3aed,#111827,#e11d48);display:grid;place-items:center;font-size:50px}.body{padding:17px}.tag{color:var(--yellow);font-weight:bold;font-size:13px}.empty{padding:30px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);text-align:center}.news{display:grid;gap:12px}.news-item{padding:18px;background:var(--card);border:1px solid var(--line);border-radius:14px}footer{padding:30px 0;border-top:1px solid var(--line);color:var(--muted)}
@media(max-width:750px){nav{display:none}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="container nav"><div class="logo">Limeira <span>na Balada</span></div><nav><a href="#eventos">Eventos</a><a href="#noticias">Notícias</a><a href="#fotos">Fotos</a></nav></div></header>
<section class="hero"><div class="container"><span class="badge">📍 LIMEIRA DO OESTE - MG</span><h1>Limeira <strong>na Balada</strong></h1><p>Eventos, festas, fotos e notícias de Limeira do Oeste e região.</p><a class="btn" href="#eventos">Ver agenda</a></div></section>
<section id="eventos"><div class="container"><div class="title"><h2>🎉 Próximos eventos</h2></div><div id="eventosList" class="grid"></div></div></section>
<section id="noticias"><div class="container"><div class="title"><h2>📰 Últimas notícias</h2></div><div id="noticiasList" class="news"></div></div></section>
<section id="fotos"><div class="container"><div class="title"><h2>📸 Galerias</h2></div><div id="galeriasList" class="grid"></div></div></section>
<footer><div class="container"><b>LIMEIRA NA BALADA</b><br>📍 Limeira do Oeste - MG • © 2026</div></footer>
<script>
const key='lnb_admin_v1';
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function load(){
 const d=JSON.parse(localStorage.getItem(key)||'{"events":[],"news":[],"galleries":[]}');
 const ev=document.getElementById('eventosList'),nw=document.getElementById('noticiasList'),ga=document.getElementById('galeriasList');
 ev.innerHTML=d.events.length?d.events.map(x=>`<article class="card"><div class="cover">🎉</div><div class="body"><div class="tag">${esc(x.date||'EM BREVE')}</div><h3>${esc(x.title)}</h3><p>🕒 ${esc(x.time||'A definir')}<br>📍 ${esc(x.place||'Local a definir')}</p><p>${esc(x.desc||'')}</p></div></article>`).join(''):'<div class="empty">Ainda não há eventos cadastrados.</div>';
 nw.innerHTML=d.news.length?d.news.map(x=>`<article class="news-item"><div class="tag">${esc(x.date||'NOTÍCIA')}</div><h3>${esc(x.title)}</h3><p>${esc(x.text)}</p></article>`).join(''):'<div class="empty">Ainda não há notícias publicadas.</div>';
 ga.innerHTML=d.galleries.length?d.galleries.map(x=>`<article class="card"><div class="cover">📸</div><div class="body"><h3>${esc(x.title)}</h3><p>${esc(x.desc||'')}</p></div></article>`).join(''):'<div class="empty">Ainda não há galerias cadastradas.</div>';
}
load();
window.addEventListener('storage',load);
</script>
</body></html>
